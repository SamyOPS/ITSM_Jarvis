name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Debug frontend snapshot
        run: |
          git rev-parse HEAD
          python - <<'PY'
          from pathlib import Path
          path = Path('src/presentation/pages/admin-page.tsx')
          print(f'FILE: {path}')
          lines = path.read_text(encoding='utf-8').splitlines()
          for start, end in ((1, 40), (280, 330), (920, 935)):
              print(f'--- lines {start}-{end} ---')
              for index in range(start, min(end, len(lines)) + 1):
                  print(f'{index}: {lines[index - 1]}')
          PY

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: E2E
        run: npm run test:e2e
